[package]
name = "apcore-mcp"
version = "0.23.3"
edition = "2021"
description = "MCP bridge for apcore — expose apcore modules as MCP tools"
license = "Apache-2.0"
readme = "README.md"
authors = ["aiperceivable <tercel.yi@gmail.com>"]
homepage = "https://aiperceivable.com"
repository = "https://github.com/aiperceivable/apcore-mcp-rust"
documentation = "https://apcore.aiperceivable.com/"
keywords = ["ai", "llm", "mcp", "apcore", "tools"]
categories = [
    "api-bindings",
    "asynchronous",
    "web-programming",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Re-vetted against apcore 0.32.3 and apcore-toolkit 0.14.1.
apcore = ">=0.32.3"
apcore-toolkit = ">=0.14.1"
mcp-embedded-ui = "0.5"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# MCP schema validation must reject external retrieval even when apcore enables it.
jsonschema = { version = "0.28", default-features = false }
# Inspect all schema references, including unused definitions, without retrieval.
referencing = "0.28"
schemars = "0.8"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
jsonwebtoken = "9"
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
hyper = { version = "1", features = ["full"] }
regex = "1"
strum = "0.26"
strum_macros = "0.26"
uuid = { version = "1", features = ["v4", "serde"] }
# `io-util` supplies `wrappers::LinesStream`, whose `next()` is
# cancellation-safe — the stdio transport reads through it inside a `select!`.
tokio-stream = { version = "0.1", features = ["io-util"] }
futures = "0.3"

[target.'cfg(unix)'.dependencies]
# Safe descriptor duplication/redirection; no raw descriptor ownership in the bridge.
rustix = { version = "1", features = ["stdio"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
# `test-util` supplies the paused clock, so a timeout test asserts the
# timeout rather than sleeping for it.
tokio = { version = "1", features = ["full", "test-util"] }
chrono = { version = "0.4", features = ["serde"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"

[[bin]]
name = "apcore-mcp"
path = "src/bin/apcore-mcp.rs"

[[example]]
name = "run"
path = "examples/run/main.rs"

[[example]]
name = "extensions"
path = "examples/extensions/main.rs"

[[example]]
name = "binding_demo"
path = "examples/binding_demo/main.rs"
