[package]
name = "apcore-mcp"
version = "0.20.0"
edition = "2021"
description = "MCP bridge for apcore — expose apcore modules as MCP tools"
license = "Apache-2.0"
readme = "README.md"
authors = ["aiperceivable <tercel.yi@gmail.com>"]
homepage = "https://aiperceivable.com"
repository = "https://github.com/aiperceivable/apcore-mcp-rust"
documentation = "https://apcore.aiperceivable.com/"
keywords = ["ai", "llm", "mcp", "apcore", "tools"]
categories = [
    "api-bindings",
    "asynchronous",
    "web-programming",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Bounded to the 0.28.x line (not ">=0.28.0", not the previous "0.27" left
# uncapped-by-accident): a bare version string is cargo's caret syntax, so
# "0.27" resolved as ">=0.27.0, <0.28.0" and could never pick up 0.28.0 no
# matter how long `cargo update` was run. Bumping the written minor is a
# deliberate per-release act of re-vetting against that line's breaking
# changes, matching the same "raised to ^0.27, and bounded" policy recorded
# in CHANGELOG.md for the previous bump.
apcore = ">=0.30"
apcore-toolkit = ">=0.11.1"
mcp-embedded-ui = "0.5"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
jsonwebtoken = "9"
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
hyper = { version = "1", features = ["full"] }
regex = "1"
strum = "0.26"
strum_macros = "0.26"
uuid = { version = "1", features = ["v4", "serde"] }
# `io-util` supplies `wrappers::LinesStream`, whose `next()` is
# cancellation-safe — the stdio transport reads through it inside a `select!`.
tokio-stream = { version = "0.1", features = ["io-util"] }
futures = "0.3"

[dev-dependencies]
# `test-util` supplies the paused clock, so a timeout test asserts the
# timeout rather than sleeping for it.
tokio = { version = "1", features = ["full", "test-util"] }
chrono = { version = "0.4", features = ["serde"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"

[[bin]]
name = "apcore-mcp"
path = "src/bin/apcore-mcp.rs"

[[example]]
name = "run"
path = "examples/run/main.rs"

[[example]]
name = "extensions"
path = "examples/extensions/main.rs"

[[example]]
name = "binding_demo"
path = "examples/binding_demo/main.rs"
